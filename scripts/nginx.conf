##
## MANO Attendance (HRM) – Nginx site configuration
##
## Copy of the live file in /etc/nginx/conf.d/ on the EC2 server, taken
## 2026-09-30. The same nginx also serves the corporate website (mano.co.in,
## API on port 8001) and the ERP (erp.mano.co.in, API on port 5001) from
## their own files. The deploy workflow does not install this file: after
## changing the server's file, update this copy too (and the reverse).
##
## - The frontend build is served from /var/www/MANO-HRM-Web/frontend/dist.
## - /api/ is proxied to the backend on 127.0.0.1:5002 with the /api prefix
##   removed (the backend's routes have no /api prefix).
## - /socket.io/ is proxied with WebSocket upgrade headers.
##

# Rate limiting zone for Attendance API
limit_req_zone $binary_remote_addr zone=attendance_api_limit:10m rate=30r/s;

# 1. HTTP -> HTTPS 301 Redirect
server {
    listen 80;
    listen [::]:80;
    server_name attendance.mano.co.in www.attendance.mano.co.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/MANO-HRM-Web/frontend/dist;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name attendance.mano.co.in www.attendance.mano.co.in;

    root /var/www/MANO-HRM-Web/frontend/dist;
    index index.html;

    access_log /var/log/nginx/attendance.access.log;
    error_log  /var/log/nginx/attendance.error.log;

    # SSL Certificates managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/attendance.mano.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attendance.mano.co.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Content-Type-Options   "nosniff"       always;
    add_header X-Frame-Options          "SAMEORIGIN"    always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ─── REST API Proxy (Port 5002) ──────────────────────────────────────────
    location ^~ /api/ {
        limit_req zone=attendance_api_limit burst=60 nodelay;

        proxy_pass         http://127.0.0.1:5002/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        client_max_body_size  50M;
    }

    # ─── WebSocket / Socket.IO Proxy ─────────────────────────────────────────
    location ^~ /socket.io/ {
        proxy_pass         http://127.0.0.1:5002/socket.io/;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    86400s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    86400s;

        proxy_buffering       off;
    }

    # ─── Firebase Push Notifications Service Worker ──────────────────────────
    location = /firebase-messaging-sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # ─── Static Assets Caching ───────────────────────────────────────────────
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|json)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── React SPA Routing ───────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }
}
